<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Diary System</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef6ff,#f8fbff);
  color:#172033;
}

.header{
  background:white;
  padding:22px 18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.header h1{
  color:#1769e0;
  font-size:25px;
}

.header p{
  color:#6b7280;
  margin-top:6px;
}

.container{
  max-width:650px;
  margin:30px auto;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 30px rgba(30,80,150,.10);
}

.title{
  font-size:21px;
  margin-bottom:22px;
}

label{
  display:block;
  font-weight:bold;
  margin:17px 0 7px;
}

select,
textarea,
input{
  width:100%;
  padding:14px;
  border:1px solid #d7deea;
  border-radius:10px;
  font-size:15px;
  outline:none;
  background:white;
}

select:focus,
textarea:focus,
input:focus{
  border-color:#1769e0;
  box-shadow:0 0 0 3px rgba(23,105,224,.10);
}

textarea{
  min-height:150px;
  resize:vertical;
}

.classes{
  display:grid;
  gap:10px;
  margin-top:10px;
}

.class-card{
  border:2px solid #e2e8f0;
  padding:15px;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.class-card:hover{
  border-color:#1769e0;
  background:#f4f8ff;
}

.class-card.active{
  border-color:#1769e0;
  background:#eef5ff;
}

.class-name{
  font-size:17px;
  font-weight:bold;
}

.subject{
  color:#667085;
  margin-top:5px;
  font-size:14px;
}

button{
  width:100%;
  border:0;
  padding:15px;
  margin-top:22px;
  border-radius:11px;
  background:#1769e0;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0f58c5;
}

.success{
  display:none;
  text-align:center;
  padding:25px 10px;
}

.success-icon{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:50%;
  background:#dcfce7;
  color:#16a34a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.success h2{
  margin-top:15px;
  color:#15803d;
}

.details{
  margin-top:20px;
  background:#f7fafc;
  border-radius:12px;
  padding:15px;
  text-align:left;
  line-height:2;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  .container{
    margin:18px auto;
  }

  .card{
    padding:20px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>📘 School Diary</h1>
  <p>Daily Homework & Diary Submission</p>
</header>

<main class="container">

<div class="card" id="formCard">

  <h2 class="title">👨‍🏫 Teacher Diary</h2>

  <label>Select Teacher *</label>

  <select id="teacher" onchange="showClasses()">
    <option value="">Select your name</option>
    <option value="Hassan">Hassan Ahmed</option>
    <option value="Ayesha">Ayesha Khan</option>
    <option value="Usman">Usman Raza</option>
  </select>


  <div id="classArea" class="hidden">

    <label>Select Class & Section *</label>

    <div class="classes" id="classes"></div>

  </div>


  <div id="diaryArea" class="hidden">

    <label>📚 Subject</label>

    <input id="subject" readonly>


    <label>📅 Date *</label>

    <input type="date" id="date">


    <label>📝 Today's Homework / Diary *</label>

    <textarea
      id="homework"
      placeholder="Write today's homework or diary details here..."
    ></textarea>


    <label>📌 Additional Remarks</label>

    <textarea
      id="remarks"
      style="min-height:90px"
      placeholder="Optional remarks..."
    ></textarea>


    <button onclick="submitDiary()">
      🚀 Submit Diary
    </button>

  </div>

</div>


<div class="card success" id="successCard">

  <div class="success-icon">✓</div>

  <h2>Diary Submitted Successfully!</h2>

  <p style="margin-top:8px;color:#667085;">
    Your diary has been saved in the system.
  </p>

  <div class="details">
    👨‍🏫 <b>Teacher:</b> <span id="sTeacher"></span><br>
    🏫 <b>Class:</b> <span id="sClass"></span><br>
    📚 <b>Subject:</b> <span id="sSubject"></span><br>
    📅 <b>Date:</b> <span id="sDate"></span>
  </div>

  <button onclick="location.reload()">
    + Submit Another Diary
  </button>

</div>

</main>


<script>

const allocations = {

  Hassan:[
    {
      class:"6-A",
      subject:"English"
    },
    {
      class:"6-B",
      subject:"English"
    },
    {
      class:"7-D",
      subject:"Mathematics"
    }
  ],

  Ayesha:[
    {
      class:"5-A",
      subject:"Science"
    },
    {
      class:"5-B",
      subject:"Science"
    }
  ],

  Usman:[
    {
      class:"8-A",
      subject:"Urdu"
    }
  ]

};


let selectedClass = "";
let selectedSubject = "";


document.getElementById("date").value =
  new Date().toISOString().split("T")[0];


function showClasses(){

  const teacher =
    document.getElementById("teacher").value;

  const area =
    document.getElementById("classArea");

  const classes =
    document.getElementById("classes");

  document.getElementById("diaryArea")
    .classList.add("hidden");

  classes.innerHTML="";

  if(!teacher){
    area.classList.add("hidden");
    return;
  }

  area.classList.remove("hidden");

  allocations[teacher].forEach(item=>{

    const div =
      document.createElement("div");

    div.className="class-card";

    div.innerHTML=`
      <div class="class-name">
        🏫 ${item.class}
      </div>

      <div class="subject">
        📚 ${item.subject}
      </div>
    `;

    div.onclick=()=>{

      document
        .querySelectorAll(".class-card")
        .forEach(x=>x.classList.remove("active"));

      div.classList.add("active");

      selectedClass=item.class;
      selectedSubject=item.subject;

      document.getElementById("subject")
        .value=item.subject;

      document.getElementById("diaryArea")
        .classList.remove("hidden");

    };

    classes.appendChild(div);

  });

}


function submitDiary(){

  const teacher =
    document.getElementById("teacher").value;

  const date =
    document.getElementById("date").value;

  const homework =
    document.getElementById("homework").value.trim();

  if(!teacher || !selectedClass || !date || !homework){

    alert("Please complete all required fields.");

    return;
  }


  document.getElementById("sTeacher")
    .textContent=teacher;

  document.getElementById("sClass")
    .textContent=selectedClass;

  document.getElementById("sSubject")
    .textContent=selectedSubject;

  document.getElementById("sDate")
    .textContent=date;


  document.getElementById("formCard")
    .style.display="none";

  document.getElementById("successCard")
    .style.display="block";

}

</script>

</body>
                               </html>
