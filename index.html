<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Diary System</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef6ff,#f8fbff);
  color:#172033;
}

.header{
  background:white;
  padding:20px 18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.header h1{
  color:#1769e0;
  font-size:25px;
}

.header p{
  color:#6b7280;
  margin-top:6px;
}

.admin-link{
  text-decoration:none;
  background:#eef5ff;
  color:#1769e0;
  padding:10px 12px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}

.container{
  max-width:680px;
  margin:25px auto;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 30px rgba(30,80,150,.10);
}

.title{
  font-size:21px;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:17px 0 7px;
}

select,
textarea,
input{
  width:100%;
  padding:14px;
  border:1px solid #d7deea;
  border-radius:10px;
  font-size:15px;
  outline:none;
  background:white;
}

select:focus,
textarea:focus,
input:focus{
  border-color:#1769e0;
  box-shadow:0 0 0 3px rgba(23,105,224,.10);
}

textarea{
  min-height:150px;
  resize:vertical;
}

.classes{
  display:grid;
  gap:10px;
  margin-top:10px;
}

.class-card{
  border:2px solid #e2e8f0;
  padding:15px;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
  background:white;
}

.class-card:hover{
  border-color:#1769e0;
  background:#f4f8ff;
}

.class-card.active{
  border-color:#1769e0;
  background:#eef5ff;
}

.class-name{
  font-size:17px;
  font-weight:bold;
}

.subject{
  color:#667085;
  margin-top:6px;
  font-size:14px;
}

.no-data{
  padding:15px;
  border-radius:10px;
  background:#f8fafc;
  color:#667085;
  text-align:center;
}

button{
  width:100%;
  border:0;
  padding:15px;
  margin-top:22px;
  border-radius:11px;
  background:#1769e0;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0f58c5;
}

.success{
  display:none;
  text-align:center;
  padding:25px 10px;
}

.success-icon{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:50%;
  background:#dcfce7;
  color:#16a34a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.success h2{
  margin-top:15px;
  color:#15803d;
}

.details{
  margin-top:20px;
  background:#f7fafc;
  border-radius:12px;
  padding:15px;
  text-align:left;
  line-height:2;
}

.hidden{
  display:none;
}

.warning{
  display:none;
  background:#fff7ed;
  color:#9a3412;
  padding:13px;
  border-radius:10px;
  margin-top:15px;
  font-size:14px;
}

@media(max-width:600px){

  .header-top{
    align-items:flex-start;
  }

  .header h1{
    font-size:21px;
  }

  .admin-link{
    font-size:12px;
    padding:8px 9px;
  }

  .container{
    margin:18px auto;
  }

  .card{
    padding:20px;
  }

}

</style>
</head>


<body>

<header class="header">

  <div class="header-top">

    <div>
      <h1>📘 School Diary</h1>
      <p>Daily Homework & Diary Submission</p>
    </div>

    <a class="admin-link" href="admin.html">
      ⚙️ Admin
    </a>

  </div>

</header>


<main class="container">


<!-- FORM -->

<div class="card" id="formCard">

  <h2 class="title">
    👨‍🏫 Teacher Diary
  </h2>


  <label>
    Select Teacher *
  </label>

  <select id="teacher" onchange="showClasses()">

    <option value="">
      Select your name
    </option>

  </select>


  <div id="warning" class="warning"></div>


  <div id="classArea" class="hidden">

    <label>
      Select Class & Section *
    </label>

    <div
      class="classes"
      id="classes">
    </div>

  </div>


  <div id="diaryArea" class="hidden">


    <label>
      📚 Subject
    </label>

    <input
      id="subject"
      readonly
    >


    <label>
      🌅 Shift
    </label>

    <input
      id="shift"
      readonly
    >


    <label>
      📅 Date *
    </label>

    <input
      type="date"
      id="date"
    >


    <label>
      📝 Today's Homework / Diary *
    </label>

    <textarea
      id="homework"
      placeholder="Write today's homework or diary details here..."
    ></textarea>


    <label>
      📌 Additional Remarks
    </label>

    <textarea
      id="remarks"
      style="min-height:90px"
      placeholder="Optional remarks..."
    ></textarea>


    <button onclick="submitDiary()">
      🚀 Submit Diary
    </button>

  </div>

</div>


<!-- SUCCESS -->

<div
  class="card success"
  id="successCard"
>

  <div class="success-icon">
    ✓
  </div>

  <h2>
    Diary Submitted Successfully!
  </h2>

  <p style="margin-top:8px;color:#667085;">
    Your diary has been recorded.
  </p>


  <div class="details">

    👨‍🏫
    <b>Teacher:</b>
    <span id="sTeacher"></span>
    <br>

    🏫
    <b>Class:</b>
    <span id="sClass"></span>
    <br>

    📚
    <b>Subject:</b>
    <span id="sSubject"></span>
    <br>

    🌅
    <b>Shift:</b>
    <span id="sShift"></span>
    <br>

    📅
    <b>Date:</b>
    <span id="sDate"></span>

  </div>


  <button onclick="location.reload()">
    + Submit Another Diary
  </button>

</div>


</main>


<script>


/* =========================
   DATA
========================= */

let teachers =
  JSON.parse(
    localStorage.getItem("schoolTeachers") || "[]"
  );


let submissions =
  JSON.parse(
    localStorage.getItem("schoolDiarySubmissions") || "[]"
  );


let selectedClass = "";
let selectedSubject = "";
let selectedShift = "";


/* =========================
   ELEMENTS
========================= */

const teacherSelect =
  document.getElementById("teacher");

const dateInput =
  document.getElementById("date");


/* =========================
   TODAY'S DATE
========================= */

dateInput.value =
  new Date()
  .toISOString()
  .split("T")[0];


/* =========================
   LOAD TEACHERS
========================= */

function loadTeachers(){

  teacherSelect.innerHTML =
    '<option value="">Select your name</option>';

  teachers.forEach(
    (teacher,index)=>{

      const option =
        document.createElement("option");

      option.value = index;

      option.textContent =
        teacher.name;

      teacherSelect.appendChild(option);

    }
  );


  if(teachers.length === 0){

    showWarning(
      "No teachers have been added yet. Please contact the administrator."
    );

  }

}


/* =========================
   WARNING
========================= */

function showWarning(message){

  const warning =
    document.getElementById("warning");

  warning.textContent = message;

  warning.style.display = "block";

}


function hideWarning(){

  document.getElementById("warning")
    .style.display = "none";

}


/* =========================
   SHOW CLASSES
========================= */

function showClasses(){

  hideWarning();

  const index =
    teacherSelect.value;

  const area =
    document.getElementById("classArea");

  const classes =
    document.getElementById("classes");

  const diaryArea =
    document.getElementById("diaryArea");


  diaryArea.classList.add("hidden");

  classes.innerHTML = "";


  selectedClass = "";
  selectedSubject = "";
  selectedShift = "";


  document.getElementById("subject").value = "";
  document.getElementById("shift").value = "";


  if(index === ""){

    area.classList.add("hidden");

    return;

  }


  const teacher =
    teachers[index];


  area.classList.remove("hidden");


  if(
    !teacher.allocations ||
    teacher.allocations.length === 0
  ){

    classes.innerHTML =
      '<div class="no-data">No class allocation assigned to this teacher.</div>';

    return;

  }


  teacher.allocations.forEach(
    (item)=>{

      const div =
        document.createElement("div");

      div.className =
        "class-card";


      div.innerHTML = `

        <div class="class-name">
          🏫 ${item.class}
        </div>

        <div class="subject">
          📚 ${item.subject}
          &nbsp; • &nbsp;
          🌅 ${item.shift}
        </div>

      `;


      div.onclick = ()=>{

        document
          .querySelectorAll(".class-card")
          .forEach(
            x =>
              x.classList.remove("active")
          );


        div.classList.add("active");


        selectedClass =
          item.class;

        selectedSubject =
          item.subject;

        selectedShift =
          item.shift;


        document
          .getElementById("subject")
          .value =
            item.subject;


        document
          .getElementById("shift")
          .value =
            item.shift;


        diaryArea
          .classList
          .remove("hidden");

      };


      classes.appendChild(div);

    }
  );

}


/* =========================
   SUBMIT DIARY
========================= */

function submitDiary(){

  const teacherIndex =
    teacherSelect.value;


  const date =
    dateInput.value;


  const homework =
    document
      .getElementById("homework")
      .value
      .trim();


  const remarks =
    document
      .getElementById("remarks")
      .value
      .trim();


  if(
    teacherIndex === "" ||
    !selectedClass ||
    !date ||
    !homework
  ){

    alert(
      "Please complete all required fields."
    );

    return;

  }


  const teacher =
    teachers[teacherIndex];


  /* =========================
     DUPLICATE CHECK
  ========================= */

  const duplicate =
    submissions.find(
      item =>

        item.teacher === teacher.name &&
        item.class === selectedClass &&
        item.date === date

    );


  if(duplicate){

    const update =
      confirm(
        "This teacher has already submitted a diary for this class and date.\n\nDo you want to update it?"
      );


    if(!update){

      return;

    }


    duplicate.subject =
      selectedSubject;

    duplicate.shift =
      selectedShift;

    duplicate.homework =
      homework;

    duplicate.remarks =
      remarks;

    duplicate.updatedAt =
      new Date().toISOString();


  }else{


    submissions.push({

      id:
        Date.now(),

      teacher:
        teacher.name,

      class:
        selectedClass,

      subject:
        selectedSubject,

      shift:
        selectedShift,

      date:
        date,

      homework:
        homework,

      remarks:
        remarks,

      createdAt:
        new Date().toISOString()

    });

  }


  /* SAVE */

  localStorage.setItem(
    "schoolDiarySubmissions",
    JSON.stringify(submissions)
  );


  /* SUCCESS SCREEN */

  document
    .getElementById("sTeacher")
    .textContent =
      teacher.name;


  document
    .getElementById("sClass")
    .textContent =
      selectedClass;


  document
    .getElementById("sSubject")
    .textContent =
      selectedSubject;


  document
    .getElementById("sShift")
    .textContent =
      selectedShift;


  document
    .getElementById("sDate")
    .textContent =
      date;


  document
    .getElementById("formCard")
    .style.display =
      "none";


  document
    .getElementById("successCard")
    .style.display =
      "block";

}


/* =========================
   START
========================= */

loadTeachers();

</script>

</body>
</html>
