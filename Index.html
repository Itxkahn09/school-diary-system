<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Diary System</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef6ff,#f8fbff);
  color:#172033;
}

.header{
  background:white;
  padding:22px 18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.header h1{
  color:#1769e0;
  font-size:25px;
}

.header p{
  color:#6b7280;
  margin-top:6px;
}

.container{
  max-width:650px;
  margin:30px auto;
  padding:0 16px;
}

.card{
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 8px 30px rgba(30,80,150,.10);
}

.title{
  font-size:21px;
  margin-bottom:22px;
}

label{
  display:block;
  font-weight:bold;
  margin:17px 0 7px;
}

select,
textarea,
input{
  width:100%;
  padding:14px;
  border:1px solid #d7deea;
  border-radius:10px;
  font-size:15px;
  outline:none;
  background:white;
}

select:focus,
textarea:focus,
input:focus{
  border-color:#1769e0;
  box-shadow:0 0 0 3px rgba(23,105,224,.10);
}

textarea{
  min-height:150px;
  resize:vertical;
}

.classes{
  display:grid;
  gap:10px;
  margin-top:10px;
}

.class-card{
  border:2px solid #e2e8f0;
  padding:15px;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.class-card:hover{
  border-color:#1769e0;
  background:#f4f8ff;
}

.class-card.active{
  border-color:#1769e0;
  background:#eef5ff;
}

.class-name{
  font-size:17px;
  font-weight:bold;
}

.subject{
  color:#667085;
  margin-top:5px;
  font-size:14px;
}

button{
  width:100%;
  border:0;
  padding:15px;
  margin-top:22px;
  border-radius:11px;
  background:#1769e0;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0f58c5;
}

.success{
  display:none;
  text-align:center;
  padding:25px 10px;
}

.success-icon{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:50%;
  background:#dcfce7;
  color:#16a34a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.success h2{
  margin-top:15px;
  color:#15803d;
}

.details{
  margin-top:20px;
  background:#f7fafc;
  border-radius:12px;
  padding:15px;
  text-align:left;
  line-height:2;
}
